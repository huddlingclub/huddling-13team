<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  공유 미리보기(OG) 이미지 원본. 앱의 바다·빙판·펭귄 에셋을 그대로 써서 1200×630으로 그린다.
  다시 만들 때는 roulette 폴더에서:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 --screenshot=public/og-image.png scripts/og-image.html
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<style>
  :root {
    --ink: #1e2433;
    --navy: #26305c;
    --sub: #5b6684;
    --ice: #f3f7fb;
    /* 장면 단위. 앱 캐스팅 화면의 1cqw와 같은 역할이고, 펭귄 폭이 43.6u다. */
    --u: 8.6px;
    /* 얼음 구멍 가운데 (앱 HOLE_X·HOLE_Y에 해당) */
    --hole-x: 918px;
    --hole-y: 528px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: var(--ice);
    color: var(--ink);
    font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif;
  }
  .px { position: absolute; display: block; max-width: none; image-rendering: pixelated; }

  /* 위쪽 띠: 바다 그림을 6배로 키워 수평선이 위쪽에 오게 둔다 */
  .sea { left: -60px; top: -378px; width: 1320px; }

  /* 빙판: ice.png(220×227)를 무대 폭 100u로 키운다. 구멍(x 143, y 183)이 --hole 자리에 오게 두고,
     왼쪽은 좌우를 뒤집은 한 장을 이어 붙여 화면 끝까지 덮는다. */
  .ice { width: calc(var(--u) * 100); top: calc(var(--hole-y) - var(--u) * 100 * 183 / 220); }
  .ice.right { left: calc(var(--hole-x) - var(--u) * 100 * 143 / 220); }
  /* ice.png 양 끝 열은 반투명이라, 뒤집은 왼쪽 장을 2픽셀 겹쳐 이음매로 바다가 비치지 않게 한다.
     왼쪽 장은 윗선 모양만 쓰므로 y 150 아래(뒤집힌 구멍과 눈 얼룩)는 잘라 낸다. */
  .ice.left {
    left: calc(var(--hole-x) - var(--u) * 100 * 143 / 220 - var(--u) * 100 * 218 / 220);
    transform: scaleX(-1);
    clip-path: inset(0 0 calc(100% * 77 / 227) 0);
  }
  /* 빙판 그림도 1% 비치므로 윗선(가장 깊은 곳 y 124) 아래로 같은 색 바닥을 깐다 */
  .ice-under { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--hole-y) - var(--u) * 100 * (183 - 125) / 220); background: var(--ice); }
  /* 문구 쪽 아래의 하늘색 눈 얼룩(y 197 아래)을 덮는다 */
  .ice-clean { position: absolute; left: 0; width: 670px; bottom: 0; top: calc(var(--hole-y) + var(--u) * 100 * (196 - 183) / 220); background: var(--ice); }

  /* 펭귄: 낚싯줄 끝(x 178, y 180)이 얼음 구멍 가운데에 닿게 둔다 (앱 PENGUIN_ON_ICE와 같은 비율) */
  .penguin {
    width: calc(var(--u) * 43.6);
    left: calc(var(--hole-x) - var(--u) * 43.6 * 178 / 220);
    top: calc(var(--hole-y) - var(--u) * 43.6 * 180 / 220);
  }

  /* 얼음 구멍에서 막 튀어나온 메뉴와 물방울 */
  .catch { position: absolute; width: 168px; left: calc(var(--hole-x) + 36px); top: 222px; transform: rotate(-10deg); }
  .spark { position: absolute; width: 30px; image-rendering: pixelated; }
  .drop { position: absolute; width: 12px; height: 12px; background: #ffffff; box-shadow: 0 0 0 3px #9fd3f2; }

  .copy { position: absolute; left: 72px; top: 248px; width: 520px; }
  h1 { margin: 0; font-size: 66px; line-height: 1.2; font-weight: 800; letter-spacing: -0.03em; }
  .sub { margin: 20px 0 0; font-size: 28px; line-height: 1.45; font-weight: 500; color: var(--sub); }
  .brand { display: flex; align-items: center; gap: 12px; margin-top: 40px; font-size: 26px; font-weight: 700; color: var(--navy); }
  .brand img { width: 48px; height: 48px; image-rendering: pixelated; }
</style>
</head>
<body>
  <img class="px sea" src="../assets/fishing/sea.png" alt="" />
  <div class="ice-under"></div>
  <img class="px ice left" src="../assets/fishing/ice.png" alt="" />
  <img class="px ice right" src="../assets/fishing/ice.png" alt="" />
  <div class="ice-clean"></div>
  <img class="px penguin" src="../assets/fishing/penguin.png" alt="" />
  <img class="catch" src="../assets/fishing/menu/hansik.svg" alt="" />
  <!-- 메뉴 둘레의 반짝임. 바다 위는 흰색, 빙판 위는 하늘색 -->
  <svg class="spark" style="left: 1158px; top: 226px" viewBox="0 0 5 5" shape-rendering="crispEdges"><path d="M2 0h1v5H2zM0 2h5v1H0z" fill="#fff"/></svg>
  <svg class="spark" style="left: 934px; top: 214px; width: 22px" viewBox="0 0 5 5" shape-rendering="crispEdges"><path d="M2 0h1v5H2zM0 2h5v1H0z" fill="#fff"/></svg>
  <svg class="spark" style="left: 1132px; top: 412px; width: 22px" viewBox="0 0 5 5" shape-rendering="crispEdges"><path d="M2 0h1v5H2zM0 2h5v1H0z" fill="#8fcbef"/></svg>
  <span class="drop" style="left: 1024px; top: 462px"></span>
  <span class="drop" style="left: 1074px; top: 432px; width: 9px; height: 9px"></span>
  <span class="drop" style="left: 974px; top: 444px; width: 9px; height: 9px"></span>
  <div class="copy">
    <h1>점심 메뉴가<br />고민이신가요?</h1>
    <p class="sub">고민은 퍼디가 할게요. 던지기만 하세요</p>
    <div class="brand"><img src="../public/favicon-48.png" alt="" />꼬륵 : 낚아낚아 퍼디</div>
  </div>
</body>
</html>
