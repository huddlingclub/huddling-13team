name: Deploy roulette

# main에 합친 룰렛이 곧 https://clipfriends.club/huddling 에 올라간 것과 같다.
on:
  push:
    branches: [main]
    paths:
      - 'roulette/**'
      - '.github/workflows/deploy-roulette.yml'
  workflow_dispatch:

# 배포가 겹치면 옛 커밋이 나중에 끝나 라이브에 남을 수 있어서, 진행 중인 배포를 취소하고 새 것만 돌린다.
concurrency:
  group: deploy-roulette
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: roulette
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: roulette/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 저장소 시크릿이 없어 배포할 수 없어요. README의 배포 절을 보세요."
            exit 1
          fi
          npx wrangler deploy
